# Génère le lien de connexion d'un réseau dans le projet Composio Platform.
#
# Pourquoi un workflow : la clé du projet (`ak_…`) vit dans les secrets — ni
# dans le chat, ni sur un poste. Le runner l'utilise pour demander à Composio
# un lien d'autorisation, et l'imprime dans le journal du job. Il ne reste
# qu'à l'ouvrir et autoriser le compte du client — le compte pro qui
# administre la page.
#
# Actions → « Composio — lien de connexion » → Run workflow, choisir le
# réseau. Le lien est dans le journal de l'étape « Lien ».

name: Composio — lien de connexion

on:
  workflow_dispatch:
    inputs:
      toolkit:
        description: "Réseau à connecter"
        type: choice
        options:
          - google_analytics
          - linkedin
          - youtube
          - tiktok
        default: "linkedin"
      utilisateur:
        description: "Identifiant sous lequel ranger le compte (UUID de l'espace client)"
        type: string
        default: "anmf"
      portees:
        description: "Portées OAuth à demander (facultatif — LinkedIn a les siennes par défaut)"
        type: string
        default: ""

jobs:
  lien:
    name: Lien de connexion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installation
        run: pnpm install --frozen-lockfile
      - name: Lien
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: >-
          pnpm composio:lien --toolkit "${{ inputs.toolkit }}" --user "${{ inputs.utilisateur }}"
          ${{ inputs.portees != '' && format('--portees "{0}"', inputs.portees) || '' }}
