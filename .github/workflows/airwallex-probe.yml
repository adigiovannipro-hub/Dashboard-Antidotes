# Sonde Airwallex — un seul appel, brut, pour départager deux causes.
#
# La synchronisation reçoit un « 403 Forbidden » en HTML depuis Vercel, alors
# que l'hôte est le bon, la clé sans restriction d'IP et les droits Spend
# accordés. Deux explications restent, et elles demandent des réponses
# opposées :
#
#   • Airwallex refuse la clé — problème d'identifiants, à régler chez eux ;
#   • un pare-feu refuse l'adresse IP de l'hébergeur — problème de réseau, à
#     contourner autrement.
#
# Ce workflow rejoue le même appel depuis une machine GitHub, dont l'adresse
# IP n'a rien à voir avec celles de Vercel, et affiche les en-têtes de la
# réponse : ils nomment qui répond. Un `server: awselb`, un `cf-ray` ou un
# `via: 1.1 google` désignent un intermédiaire, pas l'API.
#
# À lancer une fois, puis à supprimer. Rien de tout ceci n'appartient au
# fonctionnement normal du projet.
#
# Secrets requis : AIRWALLEX_CLIENT_ID, AIRWALLEX_API_KEY — les mêmes valeurs
# que dans Vercel.

name: Sonde Airwallex

on:
  workflow_dispatch:

jobs:
  sonder:
    name: Appel direct de /api/v1/authentication/login
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Interroger Airwallex
        env:
          CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$API_KEY" ]; then
            echo "::error::Secrets AIRWALLEX_CLIENT_ID et AIRWALLEX_API_KEY requis dans GitHub."
            exit 1
          fi

          echo "Longueur client_id : ${#CLIENT_ID} caractères"
          echo "Longueur api_key   : ${#API_KEY} caractères"
          echo

          for hote in https://api.airwallex.com https://api-demo.airwallex.com; do
            echo "════════ $hote ════════"
            # `-D -` écrit les en-têtes de réponse sur la sortie : c'est là que
            # se lit l'identité de qui répond, pare-feu ou API.
            curl -sS -o /tmp/corps.txt -D - --max-time 30 \
              -X POST "$hote/api/v1/authentication/login" \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              -H "user-agent: Antidotes/1.0" \
              -H "x-client-id: $CLIENT_ID" \
              -H "x-api-key: $API_KEY" \
              -d '{}' || echo "(connexion impossible)"
            echo "──── corps (300 premiers caractères) ────"
            head -c 300 /tmp/corps.txt 2>/dev/null || true
            echo
            echo
          done

          # Toujours vert : ce workflow ne juge pas, il rapporte. C'est la
          # lecture des en-têtes qui tranche.
          echo "Sonde terminée — lire les en-têtes ci-dessus."
