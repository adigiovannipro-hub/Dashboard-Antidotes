# Le banc d'essai de la chaîne de facturation.
#
# `workflow_dispatch` n'apparaît dans l'onglet Actions que lorsque le fichier
# est déjà sur la branche par défaut — ce qui n'est pas le cas tant que le
# chantier n'est pas fusionné. En attendant, **la branche poussée dit ce qu'on
# veut faire**, et une poussée suffit à jouer l'étape suivante :
#
#   banc-preparer     crée le client, le produit, la facture modèle et le devis
#   banc-etat         dit où en est le scénario, mails journalisés compris
#   banc-relance-1    antidate le journal pour rendre la 1re relance due
#   banc-relance-2    idem pour la 2e
#   banc-nettoyer     supprime le devis d'essai et son journal
#
# À retirer une fois la chaîne éprouvée : un banc d'essai est un instrument de
# mesure, pas un rouage.

name: Factures — banc d'essai

on:
  push:
    branches:
      - banc-preparer
      - banc-etat
      - banc-relance-1
      - banc-relance-2
      - banc-nettoyer

concurrency:
  group: factures-banc
  cancel-in-progress: false

jobs:
  jouer:
    name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Étape du banc
        run: |
          case "${{ github.ref_name }}" in
            banc-preparer)  pnpm factures:test --preparer ;;
            banc-etat)      pnpm factures:test --etat ;;
            banc-relance-1) pnpm factures:test --relance 1 ;;
            banc-relance-2) pnpm factures:test --relance 2 ;;
            banc-nettoyer)  pnpm factures:test --nettoyer ;;
            *) echo "Branche inattendue"; exit 1 ;;
          esac
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
