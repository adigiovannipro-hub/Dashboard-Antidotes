# Sonde ponctuelle — quel chemin d'API rend le nom d'un client de facturation ?
# À lancer une fois, lire les statuts, corriger `CUSTOMER_PATHS`, puis
# supprimer ce workflow et son script. Rien de tout ceci n'appartient au
# fonctionnement normal du projet.

name: Sonde clients Airwallex

on:
  workflow_dispatch:

jobs:
  sonder:
    name: Chemins candidats de l'API clients
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Sonder
        run: node --conditions=react-server --import tsx scripts/probe-clients.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
