# La sonde de l'API de facturation Airwallex — lecture seule.
#
# Elle vit ici et non sur Vercel pour la raison déjà établie : Airwallex refuse
# les adresses IP de l'hébergeur. Elle se déclenche sur poussée d'une branche
# nommée, et non par `workflow_dispatch` : ce dernier n'apparaît que lorsque le
# fichier est déjà sur la branche par défaut, ce qui est exactement ce qu'on
# n'a pas encore quand on sonde.
#
# À supprimer une fois la question tranchée — une sonde est un instrument de
# mesure, pas un rouage.

name: Sonde des factures Airwallex

on:
  push:
    branches:
      - sonde-factures
  workflow_dispatch:
    inputs:
      ecriture:
        description: "Tenter la chaîne d'émission en brouillon (créé puis supprimé)"
        type: boolean
        default: false

concurrency:
  group: sonde-factures
  cancel-in-progress: true

jobs:
  sonder:
    name: Lecture seule
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Sonder
        run: pnpm sonde:factures ${{ inputs.ecriture && '--ecriture' || '' }}
        env:
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
