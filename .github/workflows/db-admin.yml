# La télécommande base de données — pour un projet piloté sans terminal.
#
# Tout se déclenche depuis l'onglet Actions de GitHub : Actions →
# « Base de données » → Run workflow, cocher ce qu'on veut, lancer.
# C'est l'équivalent cloud des commandes qu'on taperait en local, et le seul
# moyen prévu d'appliquer les migrations : rien ne les applique au déploiement,
# et c'est délibéré — un schéma ne change pas par effet de bord d'un push.
#
# Les secrets se règlent une fois : Settings → Secrets and variables →
# Actions. La liste exacte est dans le README.

name: Base de données

on:
  workflow_dispatch:
    inputs:
      seed_finance:
        description: "Amorcer les données de démonstration Finance"
        type: boolean
        default: false
      import_billing_monday:
        description: "Reprendre le board Monday Échéances (une fois, sans doublon)"
        type: boolean
        default: false
      dedupe_billing:
        description: "Échéances : supprimer les devis en double"
        type: boolean
        default: false
      reconcile_billing:
        description: "Échéances : rapprocher les mensualités des factures émises"
        type: boolean
        default: false
      seed_reset:
        description: "… en effaçant d'abord les données Finance (--reset)"
        type: boolean
        default: false
      purge_finance_demo:
        description: "Effacer les données de démonstration Finance (garde les vraies)"
        type: boolean
        default: false
      import_followers:
        description: "Reprendre l'antériorité des abonnés relevée sur Looker"
        type: boolean
        default: false
      import_followers_dry_run:
        description: "… en essai à blanc, sans rien écrire (--dry-run)"
        type: boolean
        default: false
      previews_planning:
        description: "Planning : fabriquer les miniatures manquantes des visuels"
        type: boolean
        default: false
      isolation_tests:
        description: "Lancer les tests d'isolation RLS contre la vraie base"
        type: boolean
        default: false
      diagnostic_finance:
        description: "Diagnostic Finance (lecture seule) : statuts, soldes, dépenses"
        type: boolean
        default: false
      diagnostic_billing:
        description: "Diagnostic Échéances (lecture seule) : groupes, doublons, TVA"
        type: boolean
        default: false
      diagnostic_schema:
        description: "Diagnostic schéma (lecture seule) : colonnes réelles et privilèges d'API"
        type: boolean
        default: false
      diagnostic_linkedin:
        description: "Diagnostic LinkedIn (lecture seule) : pages entreprise vues par Composio"
        type: boolean
        default: false
      diagnostic_linkedin_sonde:
        description: "… en sondant en plus les statistiques d'une page (identifiant d'organisation)"
        type: string
        default: ""
      sync_linkedin:
        description: "Collecter LinkedIn maintenant (slug d'espace, ou « tout »)"
        type: string
        default: ""
      sync_linkedin_depuis:
        description: "… depuis cette date (AAAA-MM-JJ), pour un rattrapage"
        type: string
        default: ""
      diagnostic_tiktok:
        description: "Ce que Composio voit de TikTok (« oui » pour lancer)"
        type: string
        default: ""
      sonde_linkedin_rest:
        description: "Sonder l'API REST LinkedIn en direct (identifiant d'organisation)"
        type: string
        default: ""
      sonde_linkedin_publication:
        description: "… sur ce mois (AAAA-MM)"
        type: string
        default: ""
      renvoi_factures:
        description: "Factures : renvoyer les N derniers envois (nombre, vide = non)"
        type: string
        default: ""
      renvoi_factures_suffixe:
        description: "… en ajoutant ceci à la fin de l'objet"
        type: string
        default: " (renvoi suite à bug réception mail)"
      renvoi_factures_simulation:
        description: "… en simulation : décide et affiche, n'envoie rien"
        type: boolean
        default: false

jobs:
  operer:
    name: Migrations et opérations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # Toujours en premier : un seed sur un schéma en retard échouerait, et
      # `db:migrate` ne rejoue jamais ce qui est déjà appliqué.
      - name: Migrations
        run: pnpm db:migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # L'antériorité des abonnés : à jouer une fois par jeu de chiffres, et
      # rejouable sans risque — la clé primaire met à jour au lieu d'empiler.
      - name: Antériorité des abonnés
        if: ${{ inputs.import_followers }}
        run: pnpm import:followers ${{ inputs.import_followers_dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Reprise du board Monday Échéances
        if: ${{ inputs.import_billing_monday }}
        run: pnpm import:billing-monday
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Après l'import, jamais avant : c'est lui qui peut créer le doublon.
      - name: Dédoublonnage des devis
        if: ${{ inputs.dedupe_billing }}
        run: pnpm dedupe:billing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # En dernier des trois : le rapprochement lit l'état une fois qu'il est
      # propre — sans doublon, et avec les correspondances de noms en place.
      - name: Rapprochement des Échéances
        if: ${{ inputs.reconcile_billing }}
        run: pnpm reconcile:billing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Amorçage Finance
        if: ${{ inputs.seed_finance }}
        run: pnpm seed:finance ${{ inputs.seed_reset && '--reset' || '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Après l'amorçage, jamais avant : l'ordre inverse effacerait ce que
      # l'étape précédente vient d'écrire. Cette étape ne touche qu'aux lignes
      # préfixées par le seed — les vraies dépenses Airwallex restent.
      - name: Purge des données de démonstration Finance
        if: ${{ inputs.purge_finance_demo }}
        run: pnpm purge:finance-demo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Diagnostic Finance
        if: ${{ inputs.diagnostic_finance }}
        run: pnpm tsx scripts/diagnostic-finance.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Diagnostic Échéances
        if: ${{ inputs.diagnostic_billing }}
        run: pnpm diagnostic:billing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Ce que la base contient *vraiment*, colonne par colonne, avec les
      # privilèges dont dépend le cache de PostgREST. Le seul moyen de
      # distinguer « la colonne n'existe pas » de « l'API ne la voit pas »
      # quand on n'a pas de terminal sur la base.
      - name: Diagnostic schéma
        if: ${{ inputs.diagnostic_schema }}
        run: pnpm diagnostic:schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Les pages entreprise que le compte LinkedIn connecté administre.
      # L'API Composio n'est pas joignable depuis l'environnement de
      # développement distant : ce runner est le seul endroit d'où la
      # question se pose. Lecture seule, rien n'est écrit.
      - name: Diagnostic LinkedIn
        if: ${{ inputs.diagnostic_linkedin }}
        run: >-
          pnpm diagnostic:linkedin
          ${{ inputs.diagnostic_linkedin_sonde != '' && format('--sonde "{0}"', inputs.diagnostic_linkedin_sonde) || '' }}
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      # La collecte LinkedIn à la main : le cron tourne à 5 h, et on ne veut
      # pas attendre demain pour constater un branchement.
      - name: Collecte LinkedIn
        if: ${{ inputs.sync_linkedin != '' }}
        run: >-
          pnpm sync:linkedin
          ${{ inputs.sync_linkedin != 'tout' && format('--espace "{0}"', inputs.sync_linkedin) || '' }}
          ${{ inputs.sync_linkedin_depuis != '' && format('--depuis "{0}"', inputs.sync_linkedin_depuis) || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # `publicEnv` se valide au chargement du module : sans la clé anon,
          # le script meurt à l'import, avant la moindre ligne utile.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      # TikTok, avant d'écrire la moindre ligne de connecteur : quelle
      # configuration d'authentification existe, quel compte est branché dans
      # CE projet, ce que rendent les deux outils emballés, et jusqu'où porte
      # le passage brut — la Display API et la Business API ne sont pas sur
      # le même hôte, et c'est ce qui décide de la forme du connecteur.
      - name: Diagnostic TikTok
        if: ${{ inputs.diagnostic_tiktok != '' }}
        run: pnpm diagnostic:tiktok
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      # L'API REST de LinkedIn en direct, par le passage brut de Composio :
      # ce que ses outils pré-emballés refusent de demander.
      - name: Sonde LinkedIn REST
        if: ${{ inputs.sonde_linkedin_rest != '' }}
        run: >-
          pnpm sonde:linkedin --organisation "${{ inputs.sonde_linkedin_rest }}"
          ${{ inputs.sonde_linkedin_publication != '' && format('--mois "{0}"', inputs.sonde_linkedin_publication) || '' }}
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      # Les miniatures des visuels déjà en bucket : sharp pour les images,
      # ffmpeg pour la première image des vidéos — plus préinstallé sur
      # ubuntu-latest, constaté au premier passage (les vidéos étaient
      # sautées). Idempotent — une miniature en place n'est jamais refaite.
      - name: Miniatures des visuels du Planning
        if: ${{ inputs.previews_planning }}
        # `--entetes` reprend aussi le Cache-Control des miniatures déjà en
        # place : quelques centaines de Ko, idempotent.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pnpm previews:planning --entetes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Renvoyer les derniers envois de factures, tels quels, l'objet complété :
      # pour le jour où un défaut d'affichage a touché ce qui est parti. Même
      # modèle, même facture relue chez Airwallex, même destinataire ; la
      # ligne du journal est mise à jour, jamais doublée. Airwallex refuse les
      # IP de Vercel, d'où ce runner — comme pour l'émission.
      - name: Renvoi des factures
        if: ${{ inputs.renvoi_factures != '' }}
        run: >-
          pnpm factures:renvoi
          --nombre "${{ inputs.renvoi_factures }}"
          --suffixe "${{ inputs.renvoi_factures_suffixe }}"
          ${{ inputs.renvoi_factures_simulation && '--simulation' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      # Les suites d'isolation ouvrent de vraies sessions et écrivent des
      # données préfixées (zz-fin-…, nettoyées en fin de suite). C'est ici
      # qu'elles tournent « pour de vrai » — la CI de push les saute toujours.
      - name: Tests d'isolation RLS
        if: ${{ inputs.isolation_tests }}
        run: pnpm vitest run tests/
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
