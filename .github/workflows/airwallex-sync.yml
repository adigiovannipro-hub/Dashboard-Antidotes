# Les synchronisations Airwallex — Finance et Reçus — exécutées ici et non
# sur Vercel.
#
# Deux raisons, dans cet ordre :
#
#   • Airwallex refuse les adresses IP de Vercel. Mêmes clés, même appel : un
#     jeton depuis une machine GitHub, une page « 403 Forbidden » depuis une
#     fonction Vercel. La sonde `airwallex-probe.yml` l’a établi, avant d’être supprimée.
#   • Le plan Hobby de Vercel rejette de toute façon tout cron plus fréquent
#     que le quotidien, et plafonne les fonctions à 60 secondes.
#
# La route `/api/cron/sync-finance` reste en place et reste correcte — elle ne
# peut simplement pas aboutir de là où elle s'exécute.
#
# Coût : le schedule tourne ~400 fois par mois (GitHub en laisse tomber la
# moitié) à une minute l'unité — 56 s mesurées de bout en bout le 18/08/2026,
# dont 16 s de Finance et 9 s de Reçus — sur les 2 000 minutes gratuites d'un
# dépôt privé. Le navigateur de rendu ajoute une dizaine de secondes par
# passage, cache restauré. Les déclenchements depuis l'écran s'ajoutent à ce
# budget : la fenêtre de fraîcheur de dix minutes les plafonne à six par heure
# d'utilisation réelle, soit quelques dizaines de minutes par mois — mais c'est
# le poste à regarder en premier si la facture Actions se met à monter.
#
# Trois choses à savoir sur les schedules GitHub :
#   • l'heure n'est pas garantie à la minute près — un décalage de quelques
#     minutes est normal, et sans conséquence ici ;
#   • GitHub suspend les schedules d'un dépôt inactif 60 jours — un simple
#     commit les relance ;
#   • surtout : **près d'une exécution horaire sur deux n'a jamais lieu**.
#     Relevé sur ce dépôt le 18/08/2026 — 13 exécutions le 17 au lieu de 24,
#     des trous de 2 h 30 en journée, et 6 h d'affilée le matin du 18. Le
#     `cron` est une intention, pas une garantie, et rien ne le signale.
#
# C'est pourquoi ce workflow n'est plus le seul déclencheur : ouvrir Finance ou
# Échéances lance un `workflow_dispatch` depuis l'application quand la dernière
# exécution remonte à plus de dix minutes (`/api/finance/sync`, jeton
# `GITHUB_SYNC_TOKEN`). Le passage programmé reste le filet de fond — c'est lui
# qui relève les Reçus et publie le Planning quand personne n'ouvre l'écran.
#
# L'application déclenche avec une **portée**, jamais la chaîne entière : celle-ci
# était devenue trop longue pour une attente d'écran — 4 à 6 min 30 relevées le
# 31/08, contre 56 s à l'origine.
#
#   • `finance` : ouvrir Finance ou Factures. Soldes, dépenses, factures, et le
#     rapprochement des Échéances, qui est l'étape `billing`.
#   • `moderation` : le relevé **du jour** de l'Inbox — deux jours de
#     conversations, et les commentaires des seules publications dont le
#     compteur a bougé. L'écran ne s'en sert plus qu'en repli : il l'exécute
#     lui-même, c'est devenu assez court pour tenir dans une fonction Vercel.
#   • `moderation-complet` : la passe de réparation — soixante jours,
#     rattrapage des photos de profil et des auteurs masqués. Elle dure des
#     minutes : c'est elle qui a besoin d'un runner, et c'est elle que le
#     créneau nocturne `40 2 * * *` joue tout seul chaque nuit.
#
# Deux plannings sur le même workflow, donc, et une seule variable les
# distingue : `github.event.schedule`. Sur un `schedule`, les `inputs` sont
# vides — il n'y a rien d'autre à lire.
#
# Cette seconde portée n'est pas un confort. Jusqu'ici la Modération n'avait
# qu'un déclencheur, le `schedule` ci-dessus, dont près d'une exécution sur deux
# n'a jamais lieu — et le seul déclencheur fréquent et fiable du dépôt,
# l'ouverture de Finance, **excluait explicitement** la Modération par sa
# condition. Autrement dit : rien ne la relevait de façon fiable, et la boîte
# datait de la veille sans que rien ne le dise.
#
# Une portée ne doit jamais faire partir un message : ouvrir un écran ne relance
# ni les séquences de prospection, ni les factures, ni la publication du
# Planning. Le passage programmé et le bouton « Run workflow » de GitHub (défaut
# `tout`) gardent la chaîne entière.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, AIRWALLEX_CLIENT_ID, AIRWALLEX_API_KEY —
#   plus, pour les Reçus : CREDENTIALS_ENCRYPTION_KEY,
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, et si on veut le
#   transfert automatique, ANTHROPIC_API_KEY.

name: Synchronisation Airwallex

on:
  schedule:
    # Minute 17 et non 0 : les pics de la pleine heure sont les moments où
    # GitHub retarde le plus ses schedules.
    - cron: "17 * * * *"
    # Le relevé complet de l'Inbox, une fois par nuit — 02h40 UTC, soit 04h40
    # à Paris l'été, 03h40 l'hiver : personne n'ouvre son inbox à cette
    # heure-là, et le passage a tout le temps de rattraper soixante jours.
    # C'est `github.event.schedule` qui distingue les deux plannings du même
    # workflow — sur un `schedule`, les `inputs` sont vides, il n'y a rien
    # d'autre à lire.
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      portee:
        description: "Ce que le passage exécute"
        type: choice
        default: tout
        options:
          - tout
          - finance
          # Le relevé du jour de l'Inbox. L'écran ne s'en sert plus que sans
          # jeton GitHub : il l'exécute lui-même, c'est devenu assez court.
          - moderation
          # La passe de réparation, celle qui dure des minutes.
          - moderation-complet

concurrency:
  group: finance-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    name: Finance et Reçus
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # Le navigateur qui rend les mails en PDF fidèle. Il n'existe que sur ce
      # runner : l'hébergeur, d'où part la validation manuelle, n'en a pas —
      # d'où le rendu à la lecture du mail plutôt qu'au transfert.
      #
      # Mis en cache : le téléchargement coûte ~40 s, sa restauration ~10 s.
      # Sur 720 exécutions mensuelles, l'écart pèse plus que tout le reste du
      # job. `--with-deps` n'est posé qu'au premier passage, quand le cache est
      # vide ; ensuite les bibliothèques système sont déjà là.
      #
      # Seuls les Reçus s'en servent : un passage `portee: finance` s'en passe.
      # Sur un schedule, `inputs.portee` est vide — la condition reste vraie.
      - name: Cache du navigateur
        if: inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        id: cache-navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Navigateur de rendu
        if: inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm exec playwright install ${{ steps.cache-navigateur.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}

      - name: Synchroniser Finance
        if: inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm sync:finance
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          # Les vraies dépenses vivent en production ; le bac à sable est vide.
          AIRWALLEX_ENV: production

      # Dans le même job que Finance : l'installation des dépendances coûte
      # plus cher que les deux synchronisations réunies, la partager divise la
      # consommation de minutes par deux. `if: always()` — un échec Finance ne
      # doit pas priver les Reçus de leur passage, et réciproquement.
      # Greffée sur le passage horaire : le script regarde l'heure de Paris et
      # ne publie qu'**à partir de** 16h — les passages du matin coûtent une
      # seconde. Les deux créneaux cron de Vercel sont pris (Mon travail,
      # Reporting).
      #
      # « À partir de » et non « à 16h pile » : l'heure exacte n'offrait qu'une
      # chance par jour de tomber juste, et GitHub saute près d'une exécution
      # horaire sur deux — une fenêtre manquée coûtait la journée entière. Les
      # huit passages de 16h à minuit rattrapent, `planning_publications`
      # interdisant le doublon.
      - name: Publication automatique du Planning (à partir de 16h Paris)
        if: always() && inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm publier:planning
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}

      # Les posts LinkedIn du pôle Antidotes programmés à une heure passée.
      # Même greffe horaire, même raison : les deux créneaux cron de Vercel
      # sont pris. Un post n'est publié que s'il est approuvé, et son statut
      # est relu juste avant l'envoi — rien ne part deux fois.
      - name: Publication des posts programmés (Antidotes)
        if: always() && inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm studio:publier
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      # La Modération relève les commentaires Meta des comptes affectés dans
      # Connexions — même greffe horaire que la publication, les créneaux cron
      # de Vercel étant pris. Meta accepte les IP GitHub ; le passage coûte
      # quelques secondes par compte branché.
      #
      # C'est la seule étape que `portee: moderation` joue, et c'est ce que
      # l'ouverture de l'inbox déclenche (`/api/moderation/sync`). `finance`
      # continue de la sauter : un écran de comptabilité n'a rien à relever ici.
      - name: Synchroniser l'Inbox (commentaires et messages Meta)
        if: always() && inputs.portee != 'finance'
        run: pnpm sync:moderation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          # Ce que le passage redemande. Le créneau nocturne et le « Run
          # workflow » manuel font la passe complète ; le passage horaire et le
          # bouton de l'écran font le relevé du jour, qui ne redescend que les
          # publications dont le compteur de commentaires a bougé.
          MODERATION_SCOPE: "${{ (github.event.schedule == '40 2 * * *' || inputs.portee == 'tout' || inputs.portee == 'moderation-complet') && 'complet' || 'jour' }}"

      # Les séquences de prospection du pôle Antidotes : relevé des fils
      # Gmail (réponses, rebonds), observations, envois dus. Même greffe
      # horaire, même boîte Gmail que les Reçus — et jamais sur
      # `portee: finance` : ouvrir un écran ne doit pas envoyer un email à un
      # prospect. La fenêtre d'envoi (jours et heures de Paris) et le plafond
      # quotidien vivent sur chaque séquence ; un tour à vide coûte une
      # seconde.
      - name: Séquences de prospection
        if: always() && inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm sequences:passage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dashboard-antidotes-beta.vercel.app' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # L'émission des factures et leurs relances. Greffée sur le passage
      # horaire, et **jamais** sur `portee: finance` : ce dernier est ce que
      # l'ouverture d'un écran déclenche, et ouvrir une page ne doit pas
      # envoyer un mail à un client.
      #
      # Après la synchronisation Finance, et c'est un ordre voulu : le
      # rapprochement vient de marquer payées les factures réglées, et une
      # facture payée ne se relance pas.
      #
      # Coût : quelques secondes, un appel Airwallex par facture émise. Tant
      # qu'aucun devis ne porte d'adresse de destinataire, le passage ne fait
      # rien du tout — c'est l'interrupteur du dispositif.
      - name: Émettre et relancer les Factures
        if: always() && inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm factures:envoi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Synchroniser les Reçus
        if: always() && inputs.portee != 'finance' && inputs.portee != 'moderation' && inputs.portee != 'moderation-complet'
        run: pnpm sync:recus
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Le témoin de vie : un ping healthchecks.io en fin de passage, un ping
      # /fail sur échec. C'est le renversement qui manquait — jusqu'ici, un
      # workflow qui ne tournait plus ne prévenait personne ; désormais c'est
      # le **silence** qui alerte, healthchecks écrivant un email quand aucun
      # ping n'arrive dans sa fenêtre. Sans le secret `HEARTBEAT_URL`, les deux
      # étapes ne font rien : le témoin est un bonus, jamais une dépendance.
      # Marche à suivre : docs/monitoring.md.
      - name: Témoin de vie
        if: success()
        run: |
          if [ -n "${{ secrets.HEARTBEAT_URL }}" ]; then
            curl -fsS -m 10 --retry 2 "${{ secrets.HEARTBEAT_URL }}" > /dev/null || true
          fi

      - name: Témoin de vie (échec)
        if: failure()
        run: |
          if [ -n "${{ secrets.HEARTBEAT_URL }}" ]; then
            curl -fsS -m 10 --retry 2 "${{ secrets.HEARTBEAT_URL }}/fail" > /dev/null || true
          fi
