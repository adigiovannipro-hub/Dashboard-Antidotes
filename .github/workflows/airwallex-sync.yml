# Le passage programmé d'Antidotes — Finance, Reçus, publications, Inbox —
# exécuté ici et non sur Vercel : Airwallex refuse les adresses IP de
# l'hébergeur (mêmes clés, un jeton depuis GitHub, « 403 Forbidden » depuis
# une fonction Vercel — établi par sonde), et le plan Hobby plafonne une
# fonction à 60 secondes.
#
# Deux passages par jour, pas un de plus (demande du 23/09/2026) — un le soir,
# un avant le lever, heure de l'utilisateur (GMT+8). Le reste part des écrans.
#
#   • `0 15 * * *` — le soir, portée `quotidien` : Finance, publication du
#     Planning, Factures, Reçus. 23h en GMT+8 ; 17h à Paris l'été, 16h
#     l'hiver — le premier instant où la publication peut partir, toute
#     l'année, et les factures partent pendant la journée française.
#   • `40 16 * * *` — le matin, portée `matin`, dérivée du créneau : Finance,
#     Reçus, l'Inbox en passe complète (soixante jours, profils, auteurs
#     masqués, réindexation de la FAQ), la récupération des factures
#     d'abonnement — et une seconde chance pour la publication du Planning,
#     le verrou `planning_publications` interdisant le doublon.
#
# Pourquoi le matin est programmé à 00h40 et non à 7h : GitHub lance les
# schedules de ce dépôt **quatre à sept heures en retard**, tous les jours.
# Mesuré sur `recuperer-factures.yml`, créneau unique de 07h23 UTC, créé entre
# 11h18 et 14h20 UTC du 3 au 22 septembre 2026 (3 h 55 à 6 h 57 de retard),
# et sur `radar.yml` (3 h 53 à 5 h 16). Programmé à 7h, le matin tournerait
# vers midi ; à 00h40, il atterrit entre 4h30 et 7h40 — et si GitHub
# redevenait ponctuel, il tournerait à 00h40, toujours avant le lever. Le
# soir tient le même retard : 15h UTC plus le pire retard mesuré (6 h 57)
# reste avant minuit à Paris, fin de la fenêtre de publication
# (`isPublishWindow`), été comme hiver.
#
# Le reste part des écrans, par `workflow_dispatch` (`GITHUB_SYNC_TOKEN`) :
# Finance et Factures envoient `finance` (Finance et Reçus) ; l'Inbox exécute
# elle-même son relevé du jour dans sa route, sous 60 s, et n'envoie ici que
# `moderation` (repli) ou `moderation-complet` (« Tout relever »). `tout` =
# le soir et le matin réunis. `sequences` et `studio` ne partent que sous
# leur propre portée, jamais dans `tout` : le jeu de démonstration est encore
# en base, et un passage lancé par habitude ne doit pas écrire à un prospect
# fictif.
#
# La leçon chiffrée, payée en septembre 2026 : un cron horaire dont chaque
# passage avait grimpé de 2 à 13 minutes, c'est 4,7 fois le quota mensuel de
# 2 000 minutes. Ce qui doit être frais à l'ouverture se relève de l'écran.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, AIRWALLEX_CLIENT_ID, AIRWALLEX_API_KEY —
#   plus, pour les Reçus : CREDENTIALS_ENCRYPTION_KEY,
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, et si on veut le
#   transfert automatique, ANTHROPIC_API_KEY ; pour la récupération des
#   factures : FACTURES_SESSION_KEY.

name: Synchronisation Airwallex

on:
  schedule:
    # Voir l'en-tête : ces heures sont choisies pour le retard de GitHub,
    # pas malgré lui. Le soir, puis le matin.
    - cron: "0 15 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
    inputs:
      portee:
        description: "Ce que le passage exécute"
        type: choice
        default: quotidien
        options:
          - quotidien
          - matin
          - tout
          - finance
          - moderation
          - moderation-complet
          - sequences
          - studio

concurrency:
  group: finance-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    name: Passage
    runs-on: ubuntu-latest
    # Le soir tient en deux minutes ; le matin, Inbox complète et navigateur
    # de récupération compris, peut en approcher dix, et un job coupé en vol
    # serait un rouge chaque jour — celui qu'on apprend à ignorer.
    timeout-minutes: 20

    env:
      # La portée, calculée une seule fois. Sur un `schedule`, `inputs.portee`
      # est vide : c'est `github.event.schedule` qui distingue le matin du
      # soir. La chaîne comparée doit rester identique, caractère pour
      # caractère, à la ligne `cron` ci-dessus.
      PORTEE: ${{ inputs.portee || (github.event.schedule == '40 16 * * *' && 'matin') || 'quotidien' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # Le navigateur qui rend les mails en PDF fidèle. Il n'existe que sur ce
      # runner : l'hébergeur, d'où part la validation manuelle, n'en a pas —
      # d'où le rendu à la lecture du mail plutôt qu'au transfert.
      #
      # Mis en cache : le téléchargement coûte ~40 s, sa restauration ~10 s.
      # `--with-deps` n'est posé qu'au premier passage, quand le cache est
      # vide ; ensuite les bibliothèques système sont déjà là.
      #
      # Seuls les Reçus s'en servent, et le navigateur suit donc leur portée,
      # `finance` comprise : le PDF se rend à la lecture du mail, pas au
      # transfert — sans Chromium, une pièce vue pour la première fois depuis
      # l'écran garderait son PDF de texte pour toujours. Dix secondes de
      # cache restauré contre une pièce fidèle chez Airwallex.
      - name: Cache du navigateur
        if: contains(fromJSON('["quotidien","matin","tout","finance"]'), env.PORTEE)
        id: cache-navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Navigateur de rendu
        if: contains(fromJSON('["quotidien","matin","tout","finance"]'), env.PORTEE)
        run: pnpm exec playwright install ${{ steps.cache-navigateur.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}

      # Soldes, dépenses, factures, et le rapprochement des Échéances, qui en
      # est l'étape `billing`. C'est ce qu'ouvrir Finance ou Factures attend.
      - name: Synchroniser Finance
        if: contains(fromJSON('["quotidien","matin","tout","finance"]'), env.PORTEE)
        run: pnpm sync:finance
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          # Les vraies dépenses vivent en production ; le bac à sable est vide.
          AIRWALLEX_ENV: production

      # Toutes les étapes suivantes portent `always()` : un échec ne doit pas
      # priver les suivantes de leur passage. Elles partagent le job parce que
      # l'installation coûte plus cher que le travail lui-même.
      #
      # Le script regarde l'heure de Paris et ne publie qu'**à partir de**
      # 16h, et jamais un sujet daté d'hier : le soir publie, le matin
      # rattrape quand il atterrit encore avant minuit à Paris — une seconde
      # chance si GitHub a sauté le soir. `planning_publications` interdit le
      # doublon ; hors fenêtre, l'étape coûte une seconde.
      - name: Publication automatique du Planning (à partir de 16h Paris)
        if: always() && contains(fromJSON('["quotidien","matin","tout"]'), env.PORTEE)
        run: pnpm publier:planning
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}

      # L'émission des factures et leurs relances — jamais sur `finance`, la
      # portée des écrans : ouvrir une page ne doit pas envoyer un mail à un
      # client. Après Finance, et c'est un ordre voulu : le rapprochement
      # vient de marquer payées les factures réglées, et une facture payée ne
      # se relance pas. Tant qu'aucun devis ne porte d'adresse de
      # destinataire, le passage ne fait rien — c'est l'interrupteur.
      - name: Émettre et relancer les Factures
        if: always() && contains(fromJSON('["quotidien","tout"]'), env.PORTEE)
        run: pnpm factures:envoi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      # Les Reçus font partie de `finance` : l'écran Finance les montre, et
      # une pièce en attente de transfert est une donnée financière.
      - name: Synchroniser les Reçus
        if: always() && contains(fromJSON('["quotidien","matin","tout","finance"]'), env.PORTEE)
        run: pnpm sync:recus
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
          AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
          AIRWALLEX_ENV: production
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # La récupération des factures d'abonnement (Adobe, Google…), greffée au
      # matin : elle avait son propre schedule quotidien, un troisième passage
      # pour un travail mensuel. Après Finance, et c'est voulu — elle n'agit
      # que le lendemain du prélèvement carte que Finance vient de relever ;
      # le reste du mois, elle ne fait rien et n'ouvre aucun navigateur.
      # `xvfb-run` : le passage ouvre un navigateur **visible**, faute de quoi
      # le portail Adobe ne rend rien ; le runner n'ayant pas d'écran, Xvfb lui
      # en donne un faux. `recuperer-factures.yml` reste pour forcer un
      # fournisseur à la main.
      - name: Écran virtuel (récupération des factures)
        if: always() && contains(fromJSON('["matin","tout"]'), env.PORTEE)
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Récupération des factures
        if: always() && contains(fromJSON('["matin","tout"]'), env.PORTEE)
        run: xvfb-run --auto-servernum pnpm factures:passage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Chiffre les sessions de navigateur rejouées — voir
          # `recuperer-factures.yml`.
          FACTURES_SESSION_KEY: ${{ secrets.FACTURES_SESSION_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      # L'Inbox relève les commentaires et messages Meta des comptes affectés
      # dans Connexions. Meta accepte les IP GitHub. Absente du soir : le
      # relevé du jour se joue à l'ouverture de l'écran, sur Vercel, et c'est
      # le matin qui répare — dont la réindexation de la FAQ.
      - name: Synchroniser l'Inbox (commentaires et messages Meta)
        if: always() && contains(fromJSON('["matin","tout","moderation","moderation-complet"]'), env.PORTEE)
        run: pnpm sync:moderation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          # Ce que le passage redemande : `complet` pour le matin, « Tout
          # relever » et « Run workflow » en `tout` ; `jour` pour le repli de
          # l'écran, qui ne redescend que les publications dont le compteur
          # de commentaires a bougé et ne retente pas une boîte refusée.
          MODERATION_SCOPE: ${{ contains(fromJSON('["matin","tout","moderation-complet"]'), env.PORTEE) && 'complet' || 'jour' }}

      # Les séquences de prospection du pôle Antidotes : relevé des fils Gmail
      # (réponses, rebonds), observations, envois dus. Même boîte Gmail que
      # les Reçus. Sur demande explicite seulement : elles écrivent à des
      # prospects, et aucun schedule ne doit le faire tant que le pôle tourne
      # sur son jeu de démonstration.
      - name: Séquences de prospection
        if: always() && env.PORTEE == 'sequences'
        run: pnpm sequences:passage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://dashboard-antidotes-beta.vercel.app' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Les posts LinkedIn du pôle programmés à une heure passée — approuvés
      # seulement, statut relu juste avant l'envoi. Même règle que les
      # séquences : sur demande, jamais sur schedule.
      - name: Publication des posts programmés (Antidotes)
        if: always() && env.PORTEE == 'studio'
        run: pnpm studio:publier
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      # Le témoin de vie : un ping healthchecks.io en fin de passage, un ping
      # /fail sur échec. C'est le renversement qui manquait — jusqu'ici, un
      # workflow qui ne tournait plus ne prévenait personne ; désormais c'est
      # le **silence** qui alerte, healthchecks écrivant un email quand aucun
      # ping n'arrive dans sa fenêtre. Sans le secret `HEARTBEAT_URL`, les deux
      # étapes ne font rien : le témoin est un bonus, jamais une dépendance.
      # Marche à suivre : docs/monitoring.md.
      - name: Témoin de vie
        if: success()
        run: |
          if [ -n "${{ secrets.HEARTBEAT_URL }}" ]; then
            curl -fsS -m 10 --retry 2 "${{ secrets.HEARTBEAT_URL }}" > /dev/null || true
          fi

      - name: Témoin de vie (échec)
        if: failure()
        run: |
          if [ -n "${{ secrets.HEARTBEAT_URL }}" ]; then
            curl -fsS -m 10 --retry 2 "${{ secrets.HEARTBEAT_URL }}/fail" > /dev/null || true
          fi
