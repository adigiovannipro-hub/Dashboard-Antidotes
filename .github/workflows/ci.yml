# Les quatre commandes qui décident qu'un chantier tient debout — et quand
# elles tournent ici. Une branche sans pull request n'a plus de CI
# automatique : Claude joue les quatre avant de pousser, et Vercel construit
# la preview. Une PR en a une par push, `main` en a une plus les migrations,
# et « Run workflow » vérifie n'importe quelle branche à la demande. Raison :
# 373 exécutions en trente jours, dont 88 commits vérifiés deux fois (push
# puis PR) — 1 800 des 2 000 minutes gratuites, pour le même verdict.
#
# Ce que cette CI ne prouve pas, et qu'il ne faut pas lui faire dire :
# les tests d'isolation RLS ont besoin d'un vrai projet Supabase et se sautent
# en silence sans lui. Ils sont donc SAUTÉS ici, volontairement — voir la note
# de l'étape « Tests ». Un vert sur cette CI n'est pas une preuve d'isolation.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

# Un push qui en remplace un autre annule la course précédente : sur un plan
# gratuit, les minutes se dépensent une seule fois.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Les variables publiques sont des valeurs de façade : `src/lib/env.ts`
      # valide au chargement du module, et un test qui importe la chaîne des
      # requêtes échouerait sans elles.
      #
      # `SUPABASE_SERVICE_ROLE_KEY` est délibérément ABSENTE : c'est elle qui
      # fait basculer les suites d'isolation en `describe.skip`. Les brancher
      # sur un vrai projet depuis la CI voudrait dire y créer et y détruire des
      # comptes à chaque push — ces suites se lancent à la main, contre la base.
      - name: Tests
        run: pnpm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # Le build ne joint aucun service : toutes les pages qui lisent la base
      # appellent `cookies()`, ce qui les rend dynamiques et les exclut du
      # pré-rendu. Les valeurs ci-dessous ne servent qu'à satisfaire la
      # validation zod au chargement des modules.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          CREDENTIALS_ENCRYPTION_KEY: ci-placeholder-encryption-key
          CRON_SECRET: ci-placeholder-cron-secret

  # --- Migrations automatiques ---------------------------------------------
  #
  # Le schéma suivait les commits à la main, par `db-admin`. Entre un
  # déploiement et le passage de l'opérateur, le code connaissait donc des
  # colonnes que la base n'avait pas — c'est exactement ce décalage qui a vidé
  # la synchronisation organique pendant des jours.
  #
  # Trois garde-fous, et aucun n'est décoratif :
  #
  #   • `needs: verifier` — une migration ne part jamais devant un commit qui
  #     ne compile pas. C'est tout l'intérêt de la poser ici plutôt que dans
  #     un workflow séparé ;
  #   • `if` sur `refs/heads/main` — ni les branches ni les pull requests ne
  #     touchent la base. Une PR verte ne migre rien ;
  #   • une file d'attente **sans annulation** : deux pushes rapprochés se
  #     suivent au lieu de se courir dessus, et aucun passage n'est coupé au
  #     milieu d'une transaction.
  #
  # Le runner ne rejoue jamais une migration déjà appliquée (nom + empreinte
  # dans `app.schema_migrations`) : ce job ne fait donc rien la plupart du
  # temps, et c'est le comportement voulu.
  #
  # `db-admin` reste pour tout le reste — seeds, diagnostics, imports, tests
  # d'isolation. Il n'est simplement plus obligatoire pour le schéma.
  migrer:
    name: Migrations sur la vraie base
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `cancel-in-progress: false`, à l'inverse du job de vérification :
    # interrompre une migration en cours laisserait le schéma à mi-chemin.
    concurrency:
      group: migrations-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # Secret absent : on le **dit** et on échoue, plutôt que de finir vert
      # sans avoir rien appliqué. C'est la faute qu'on vient de payer sur la
      # reprise des abonnés — un succès qui n'a rien fait est pire qu'un rouge.
      - name: Migrations
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "✖ SUPABASE_DB_URL absente des secrets du dépôt — aucune migration appliquée."
            exit 1
          fi
          pnpm db:migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
