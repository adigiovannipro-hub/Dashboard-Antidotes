# La récupération des factures d'abonnement — Adobe, Google, OVH…
#
# Chaque mois, la facture d'un abonnement attend derrière un compte, sur le
# site du fournisseur : ni le mail ni Airwallex ne vont la chercher. Ce passage
# le fait, le lendemain du prélèvement, et l'envoie à Airwallex par la boîte
# Gmail déjà connectée aux Reçus.
#
# Pourquoi ici et pas sur Vercel : une fonction serverless n'a pas de
# navigateur, et rien n'y survit d'une exécution à l'autre — or une page de
# factures est réservée aux clients connectés. Le runner n'a pas de mémoire non
# plus, mais il **rejoue** une session capturée une fois depuis un vrai
# navigateur (`pnpm factures:connexion <marchand>`), chiffrée sur la fiche du
# fournisseur. Le passage ne se connecte jamais lui-même : un mot de passe,
# une double authentification, un captcha ne s'automatisent pas.
#
# Le passage quotidien est désormais une étape du matin d'`airwallex-sync.yml`
# (portée `matin`) — depuis le 23/09/2026, deux passages programmés par jour et
# pas un de plus : ce workflow en faisait un troisième, pour un travail qui ne
# sert qu'une fois par mois et ne fait rien le reste du temps. Il reste pour
# la main : forcer un fournisseur hors calendrier, ou rejouer un passage sans
# attendre le matin. Plus aucun schedule.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, FACTURES_SESSION_KEY — plus, pour l'envoi :
#   CREDENTIALS_ENCRYPTION_KEY, GOOGLE_OAUTH_CLIENT_ID,
#   GOOGLE_OAUTH_CLIENT_SECRET.

name: Récupération des factures

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Forcer un fournisseur, hors calendrier (nom du marchand)"
        type: string
        required: false

concurrency:
  group: recuperer-factures
  cancel-in-progress: false

jobs:
  recuperer:
    name: Factures des abonnements
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # Mis en cache : le téléchargement coûte ~40 s, sa restauration ~10 s.
      # `--with-deps` n'est posé qu'au premier passage, cache vide.
      - name: Cache du navigateur
        id: cache-navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Navigateur
        run: pnpm exec playwright install ${{ steps.cache-navigateur.outputs.cache-hit == 'true' && 'chromium' || '--with-deps chromium' }}

      # `xvfb-run` : le passage ouvre un navigateur **visible**, faute de quoi
      # le portail Adobe ne rend rien — la page reste sur son rond de
      # chargement. Le runner n'ayant pas d'écran, Xvfb lui en donne un faux.
      - name: Écran virtuel
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Passage
        run: xvfb-run --auto-servernum pnpm factures:passage ${{ inputs.forcer && format('--forcer "{0}"', inputs.forcer) || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Chiffre les sessions de navigateur. Volontairement distincte de la
          # clé des jetons Gmail : elle voyage entre le Mac qui ouvre la
          # session et ce runner, deux endroits qui n'ont pas la clé de prod.
          FACTURES_SESSION_KEY: ${{ secrets.FACTURES_SESSION_KEY }}
          # L'envoi passe par la boîte Gmail des Reçus.
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
